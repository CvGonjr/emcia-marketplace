name: travas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  negativos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JSON válido
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
          done

      - name: Scripts compilam
        run: python3 -m py_compile eiac-nucleo/scripts/*.py eiac-campo/scripts/*.py

      - name: Habilidades com name e description
        run: |
          falhou=0
          for f in eiac-campo/skills/*/SKILL.md; do
            grep -q '^name:' "$f" || { echo "sem name: $f"; falhou=1; }
            grep -q '^description:' "$f" || { echo "sem description: $f"; falhou=1; }
          done
          exit $falhou

      - name: Referências internas resolvem
        run: |
          falhou=0
          for r in $(grep -rho 'reference/[a-z0-9-]*\.md' eiac-campo/skills/ | sort -u); do
            test -f "eiac-campo/$r" || { echo "quebrada: $r"; falhou=1; }
          done
          exit $falhou

      - name: Testes negativos
        run: bash testes/negativos.sh

      - name: Apuração declarada do nível (A7)
        run: python3 testes/triagem_a7.py

      - name: Sessão no encerramento (A8)
        run: python3 testes/sessao_a8.py

      - name: Emissão com artefato (A9)
        run: python3 testes/emissao_a9.py

      - name: Campos declarados e E3 ponta a ponta (A10)
        run: python3 testes/campos_a10.py

      - name: Decisão humana fora da sessão (A12)
        run: python3 testes/decisao_a12.py

      - name: Bloco inicial conduzido, guardas e retomada
        run: |
          python3 testes/bloco_inicial.py
          python3 testes/iniciar_percurso.py
          python3 testes/perfis_conectores.py

      - name: Habilitação administrativa
        run: python3 testes/habilitacao.py

      - name: Passagem da habilitação ao caso e selo confirmado
        run: python3 testes/habilitacao_0d.py

      - name: Canais declarados e autoria
        run: python3 testes/canais.py

      - name: Formulários e redação fixa
        run: |
          python3 testes/formularios.py
          python3 testes/conferencia_formulario.py

      - name: Recebimento e procedência de origem
        run: python3 testes/receber.py

      - name: Entrega com emissão e destino
        run: python3 testes/entregar.py

      - name: Referência externa de sessão
        run: python3 testes/sessao_externa.py

      - name: Escopo de ferramentas MCP
        run: python3 testes/escopo_mcp.py

      - name: Percurso sintético de canais
        run: python3 testes/canais_percurso.py

      - name: Selo confirmado após encerramento
        run: python3 testes/selo_p3b.py

      - name: Restrições vinculadas a fontes
        run: python3 testes/restricoes.py

      - name: Pacote do método, manual operacional e citações
        run: |
          git clone --depth 1 --branch metodo-v1.0 --single-branch https://github.com/CvGonjr/emcia-artefatos.git ../emcia-artefatos
          python3 testes/metodo_empacotado.py
          python3 testes/apoio/falha_conhecida_a25.py
          python3 testes/citacoes.py
          python3 testes/catalogo_cat01.py
          python3 testes/prosseguimento.py

      - name: Versão do plugin mudou junto com o núcleo
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }} | grep -q '^eiac-nucleo/scripts/'; then
            git diff origin/${{ github.base_ref }} -- eiac-nucleo/.claude-plugin/plugin.json \
              | grep -q '"version"' \
              || { echo "scripts mudaram e a versão do eiac-nucleo não subiu"; exit 1; }
          fi
